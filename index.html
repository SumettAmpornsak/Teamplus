<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ทีมพลัส">
    <link rel="apple-touch-icon"
        href="https://i.ibb.co/vMtPp3r/6cc55982f8941ab0f6e5ab9efd4617606d6df850cefeaaf4f58457fbaea4963a-0.png">
    <title>ทีมพลัส · Teamplus</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="ทีมพลัส Teamplus เว็บแอพจัดการพนักงาน OT และรายงานหลากหลายรูปแบบ" />
    <meta name="author" content="Sumett Ampornsak" />
    <link rel="icon"
        href="https://i.ibb.co/vMtPp3r/6cc55982f8941ab0f6e5ab9efd4617606d6df850cefeaaf4f58457fbaea4963a-0.png"
        type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-0: #f0f9ff;
            --bg-1: #e6f0fa;
            --surface: rgba(255, 255, 255, 0.92);
            --surface-2: #ffffff;
            --surface-3: #f8fafc;
            --border: #e2e8f0;
            --border-soft: #eef2ff;
            --text: #1e293b;
            --text-dim: #475569;
            --text-faint: #94a3b8;
            --accent: #3b82f6;
            --accent-2: #2563eb;
            --accent-soft: rgba(59, 130, 246, 0.12);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.08);
            --success: #16a34a;
            --warning: #d97706;
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(145deg, var(--bg-0) 0%, var(--bg-1) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 12px 24px;
        }

        ::selection {
            background: var(--accent-soft);
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .form-label {
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }

        .form-label i {
            color: var(--accent-2);
            width: 16px;
            text-align: center;
        }

        .form-control,
        .form-select {
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 13px 16px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'Kanit', sans-serif;
            min-height: 48px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            outline: none;
            background: var(--surface-3);
            color: var(--text);
        }

        .form-select option {
            background: #ffffff;
            color: var(--text);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.65;
        }

        .staff-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            background: rgba(164, 164, 164, 0.18);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-top: 6px;
            border: 1px solid var(--border-soft);
            max-height: 280px;
            overflow-y: auto;
        }

        .staff-grid:empty::after {
            content: 'ยังไม่มีรายชื่อ — กดปุ่ม "จัดการพนักงาน" เพื่อเพิ่ม';
            color: var(--text-faint);
            font-size: 0.82rem;
            padding: 6px 2px;
        }

        .staff-chip {
            background: var(--surface-2);
            border-radius: 40px;
            padding: 9px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            border: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            min-height: 38px;
        }

        .staff-chip:active {
            transform: scale(0.96);
        }

        .staff-chip i {
            font-size: 0.8rem;
            color: var(--text-faint);
        }

        .staff-chip.active {
            background: linear-gradient(135deg, var(--accent), #2563eb);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .staff-chip.active i {
            color: white;
        }

        .badge-type {
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2px 9px;
            color: var(--text-dim);
        }

        .staff-chip.active .badge-type {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .toggle-group {
            background: rgba(0, 0, 0, 0.22);
            border-radius: 48px;
            padding: 4px;
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-soft);
        }

        .toggle-option {
            flex: 1;
            text-align: center;
            padding: 11px 0;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .toggle-option.active {
            background: var(--surface-3);
            color: var(--accent-2);
        }

        .btn-generate {
            position: relative;
            background: linear-gradient(105deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 40px;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            font-family: 'Kanit', sans-serif;
            transition: all 0.25s ease;
            box-shadow: 0 14px 30px rgba(59, 130, 246, 0.32);
            min-height: 54px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(59, 130, 246, 0.42);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-manage {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 40px;
            padding: 11px 18px;
            font-weight: 500;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
            min-height: 44px;
        }

        .btn-manage:hover {
            background: var(--surface-3);
            border-color: var(--accent);
            color: var(--accent-2);
        }

        .btn-manage i {
            color: var(--accent-2);
        }

        .result-area {
            background: rgb(0, 0, 0);
            color: #cfe0ff;
            font-family: 'Kanit', sans-serif;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            padding: 18px;
            border: 1px solid var(--border-soft);
            height: 38vh;
            resize: vertical;
        }

        .result-area:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .result-area::-webkit-scrollbar {
            width: 8px;
        }

        .result-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .result-area::-webkit-scrollbar-thumb {
            background: var(--surface-3);
            border-radius: 10px;
        }

        .copy-badge {
            position: absolute;
            right: 16px;
            top: -14px;
            background: var(--success);
            border-radius: 40px;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #06281c;
        }

        .footer-enhanced {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-soft);
        }

        .badge-version {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            color: #1e40af;
            font-weight: 600;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }

        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            width: 110px;
            height: auto;
            border-radius: 28px;
            margin-bottom: 18px;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .splash-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text);
        }

        .splash-sub {
            font-size: 0.85rem;
            color: var(--text-faint);
            margin-top: 2px;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        .spinner-wave {
            display: flex;
            gap: 5px;
            margin-top: 26px;
        }

        .spinner-wave span {
            width: 7px;
            height: 7px;
            background-color: var(--accent-2);
            border-radius: 50%;
            display: inline-block;
            animation: wave 1s infinite ease-in-out both;
        }

        .spinner-wave span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .spinner-wave span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes wave {

            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ========== MODAL REDESIGN (mobile-safe inline CRUD) ========== */
        .staff-management-modal .modal-content {
            border-radius: 26px;
            background: #ffffff;
            border: 1px solid var(--border);
            overflow: hidden;
            color: var(--text);
        }

        .staff-management-modal .modal-dialog {
            margin: 10px;
        }

        @media (min-width: 576px) {
            .staff-management-modal .modal-dialog {
                margin: 1.75rem auto;
            }
        }

        .modal-header-custom {
            padding: 20px 18px 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .modal-icon-box {
            width: 44px;
            height: 44px;
            background: var(--accent-soft);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            color: var(--accent-2);
        }

        .modal-main-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
        }

        .modal-sub-title {
            font-size: 12.5px;
            color: var(--text-faint);
            margin-top: 2px;
        }

        .modal-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 14px;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .modal-close-btn:hover {
            background: var(--surface-3);
            color: var(--text);
        }

        .modal-shift-toggle {
            display: flex;
            gap: 6px;
            background: rgba(158, 158, 158, 25%);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 14px;
            border: 1px solid var(--border-soft);
        }

        .modal-shift-btn {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            color: var(--text-dim);
            transition: all 0.2s;
            border: none;
            background: transparent;
            font-family: 'Kanit', sans-serif;
            min-height: 42px;
        }

        .modal-shift-btn.active {
            background: var(--surface-3);
            color: var(--accent-2);
        }

        .modal-tab-bar {
            display: flex;
            padding: 0 18px;
            border-bottom: 1px solid var(--border-soft);
            gap: 2px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-tab-btn {
            padding: 11px 14px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-faint);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: 'Kanit', sans-serif;
            min-height: 44px;
        }

        .modal-tab-btn.active {
            color: var(--accent-2);
            border-bottom-color: var(--accent);
        }

        .modal-tab-count {
            background: var(--surface-2);
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 500;
            border-radius: 20px;
            padding: 2px 7px;
            min-width: 20px;
            text-align: center;
        }

        .modal-tab-btn.active .modal-tab-count {
            background: var(--accent-soft);
            color: var(--accent-2);
        }

        .modal-body-custom {
            padding: 16px 18px 18px;
        }

        .staff-modern-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 46vh;
            overflow-y: auto;
            margin-bottom: 14px;
            padding-right: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .staff-modern-list::-webkit-scrollbar {
            width: 4px;
        }

        .staff-modern-list::-webkit-scrollbar-thumb {
            background: var(--surface-3);
            border-radius: 4px;
        }

        .staff-modern-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px 9px 12px;
            border-radius: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            transition: border-color 0.15s;
        }

        .staff-avatar-box {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .av-prod {
            background: rgba(59, 130, 246, 0.18);
            color: #8cb6ff;
        }

        .av-tech {
            background: rgba(52, 211, 153, 0.16);
            color: #5fe0b4;
        }

        .av-qc {
            background: rgba(251, 191, 36, 0.16);
            color: #ffcc5c;
        }

        .staff-modern-name {
            flex: 1;
            font-size: 14.5px;
            font-weight: 500;
            color: var(--text);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .action-btn-group {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface-3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-dim);
            transition: all 0.15s;
            touch-action: manipulation;
        }

        .action-icon-btn:active {
            transform: scale(0.93);
        }

        .action-icon-btn.edit:active,
        .action-icon-btn.edit:hover {
            color: var(--warning);
            border-color: rgba(251, 191, 36, 0.4);
            background: rgba(251, 191, 36, 0.12);
        }

        .action-icon-btn.del:active,
        .action-icon-btn.del:hover {
            color: var(--danger);
            border-color: rgba(245, 102, 122, 0.4);
            background: var(--danger-soft);
        }

        .action-icon-btn.confirm-ok {
            color: var(--success);
            border-color: rgba(52, 211, 153, 0.4);
            background: rgba(52, 211, 153, 0.14);
        }

        .action-icon-btn.confirm-cancel {
            color: var(--text-dim);
        }

        /* inline edit mode */
        .staff-modern-row.editing {
            background: rgba(59, 130, 246, 0.08);
            border-color: rgba(59, 130, 246, 0.35);
        }

        .edit-name-input {
            flex: 1;
            min-width: 0;
            background: var(--surface-3);
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Kanit', sans-serif;
            font-size: 14.5px;
            padding: 8px 10px;
        }

        .edit-name-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* inline delete confirm mode */
        .delete-confirm-text {
            flex: 1;
            font-size: 13.5px;
            color: var(--text-dim);
            min-width: 0;
        }

        .delete-confirm-text b {
            color: var(--text);
        }

        .add-staff-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgb(240 240 240);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 8px 8px 14px;
            transition: all 0.15s;
        }

        .add-staff-row:focus-within {
            border-color: var(--accent);
            border-style: solid;
            background: rgb(240 240 240);
        }

        .add-staff-icon {
            font-size: 14px;
            color: var(--text-faint);
            flex-shrink: 0;
        }

        .add-staff-input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            font-size: 14.5px;
            font-family: 'Kanit', sans-serif;
            color: var(--text);
            outline: none;
            padding: 9px 0;
        }

        .add-staff-input::placeholder {
            color: var(--text-faint);
        }

        .add-staff-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 11px;
            padding: 10px 16px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            transition: background 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 42px;
            flex-shrink: 0;
        }

        .add-staff-btn:active {
            background: #2563eb;
        }

        .modal-footer-custom {
            padding: 14px 18px 18px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .total-info {
            font-size: 12.5px;
            color: var(--text-faint);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .total-info .num {
            font-weight: 600;
            color: var(--text);
        }

        .done-modal-btn {
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 11px 24px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
            min-height: 44px;
        }

        .done-modal-btn:hover {
            background: var(--accent-soft);
            color: var(--accent-2);
        }

        .modal-tab-panel {
            display: none;
        }

        .modal-tab-panel.active {
            display: block;
        }

        .empty-state-modal {
            text-align: center;
            padding: 22px 0;
            color: var(--text-faint);
            font-size: 13px;
        }

        .empty-state-modal i {
            font-size: 26px;
            display: block;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .shift-badge {
            display: inline-block;
            background: var(--surface-2);
            border-radius: 20px;
            padding: 0 10px;
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-left: 6px;
            border: 1px solid var(--border-soft);
        }

        .swal2-popup {
            font-family: 'Kanit', sans-serif !important;
            border-radius: 22px !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 8px 22px;
            }

            .staff-chip {
                padding: 8px 13px;
                font-size: 0.78rem;
            }

            .glass-card {
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>
    <div id="splashScreen" class="splash-screen">
        <img src="https://i.ibb.co/vMtPp3r/6cc55982f8941ab0f6e5ab9efd4617606d6df850cefeaaf4f58457fbaea4963a-0.png"
            alt="ทีมพลัส" class="splash-logo">
        <div class="splash-title">ทีมพลัส</div>
        <div class="splash-sub">Teamplus</div>
        <div class="spinner-wave"><span></span><span></span><span></span></div>
    </div>

    <div class="container px-0" style="max-width: 640px; margin: 0 auto;">
        <div class="glass-card p-3 p-sm-4">
            <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-3">
                    <div
                        style="background: #3b82f6; width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 22px rgba(59,130,246,0.35);">
                        <img src="https://i.ibb.co/vMtPp3r/6cc55982f8941ab0f6e5ab9efd4617606d6df850cefeaaf4f58457fbaea4963a-0.png"
                            alt="" style="width: 100%; height: 100%; border-radius: 18px; object-fit: cover;">
                    </div>
                    <div>
                        <h3 class="mb-0 fw-semibold" style="color: var(--text); font-size: 1.45rem;">ทีมพลัส</h3>
                        <p class="mb-0 small" style="color: var(--text-faint);">ระบบจัดการพนักงาน และ OT</p>
                    </div>
                </div>
                <button class="btn-manage" data-bs-toggle="modal" data-bs-target="#staffManagementModal">
                    <i class="fas fa-users-gear"></i> จัดการพนักงาน
                </button>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-chart-line"></i> ประเภทรายงาน</label>
                <select id="reportTypeSelect" class="form-select">
                    <option value="ot_normal">OT ปกติ (วันปกติ)</option>
                    <option value="ot_sunday">OT วันอาทิตย์</option>
                    <option value="report_attendance">รายงานการมาปฏิบัติงาน</option>
                    <option value="report_ot_new">รายงานออก OT แบบใหม่</option>
                </select>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label"><i class="far fa-calendar-alt"></i> วันที่</label>
                    <input type="date" id="date" class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label"><i class="fas fa-exchange-alt"></i> กะ</label>
                    <select id="shift" class="form-select">
                        <option value="A">กะ A</option>
                        <option value="B" selected>กะ B</option>
                    </select>
                </div>
            </div>

            <!-- OT ปกติ -->
            <div id="otNormalSection">

                <div id="normalSection">
                    <label class="form-label"><i class="fas fa-user-minus"></i> พนักงานออก OT</label>
                    <div id="otOutList" class="staff-grid"></div>
                    <label class="form-label mt-3"><i class="fas fa-boxes"></i> OT พับถุง</label>
                    <div id="otWorkList" class="staff-grid"></div>
                </div>
                <div id="sundaySection" style="display: none;">
                    <label class="form-label"><i class="fas fa-users"></i> พนักงาน (วันอาทิตย์)</label>
                    <div id="sundayStaffList" class="staff-grid"></div>
                    <label class="form-label mt-3"><i class="fas fa-wrench"></i> ช่างผลิต</label>
                    <div id="technicianList" class="staff-grid"></div>
                </div>
            </div>

            <!-- รายงานการมาปฏิบัติงาน -->
            <div id="reportAttendanceSection" style="display: none;">
                <label class="form-label"><i class="fas fa-thermometer-half"></i> พนักงานที่ลาป่วย</label>
                <div id="sickStaffList" class="staff-grid"></div>
                <label class="form-label mt-3"><i class="fas fa-briefcase"></i> พนักงานที่ลากิจ</label>
                <div id="personalLeaveStaffList" class="staff-grid"></div>
            </div>

            <!-- รายงานออก OT แบบใหม่ -->
            <div id="reportOtNewSection" style="display: none;">
                <label class="form-label"><i class="fas fa-industry"></i> พนักงานผลิต (ออก OT)</label>
                <div id="otNewProdList" class="staff-grid"></div>
                <label class="form-label mt-3"><i class="fas fa-screwdriver-wrench"></i> ช่างผลิต (ออก OT)</label>
                <div id="otNewTechList" class="staff-grid"></div>
                <label class="form-label mt-3"><i class="fas fa-magnifying-glass-chart"></i> QC (ออก OT)</label>
                <div id="otNewQcList" class="staff-grid"></div>
            </div>

            <button id="generateBtn" class="btn-generate w-100 mt-4">
                <i class="fas fa-wand-magic-sparkles me-2"></i> สร้างข้อความ + คัดลอก
            </button>

            <div class="position-relative mt-4">
                <div class="copy-badge d-none" id="copyBadge"><i class="fas fa-circle-check"></i> คัดลอกแล้ว</div>
                <textarea id="result" class="result-area w-100" readonly
                    placeholder="ข้อความที่สร้างจะแสดงที่นี่..."></textarea>
            </div>
        </div>

        <footer class="footer-enhanced mt-3 pt-3 pb-3 px-3">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                <div class="text-center text-md-start small" style="color: var(--text-faint);">
                    <i class="far fa-copyright me-1"></i> <span id="currentYear"></span>
                    <span class="fw-semibold" style="color: var(--accent-2);">Sumett Ampornsak</span>
                    <span class="d-block d-sm-inline">All rights reserved.</span>
                </div>
                <div class="d-flex flex-wrap align-items-center justify-content-center gap-2">
                    <span class="badge-version badge rounded-pill px-3 py-2">
                        <i class="fas fa-tag me-1"></i> เวอร์ชัน 14.0.0
                    </span>
                    <div class="small d-flex align-items-center gap-1 ms-md-2" style="color: var(--text-faint);">
                        <i class="fas fa-sync-alt fa-xs opacity-75"></i>
                        <span>อัปเดตล่าสุด: 30/06/69</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- MODAL จัดการพนักงาน (dark, mobile-safe, inline CRUD) -->
    <div class="modal fade staff-management-modal" id="staffManagementModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header-custom">
                    <div class="modal-title-group">
                        <div class="modal-icon-box">
                            <i class="fas fa-users-gear"></i>
                        </div>
                        <div>
                            <div class="modal-main-title">จัดการพนักงาน</div>
                            <div class="modal-sub-title">เพิ่ม แก้ไข หรือลบรายชื่อพนักงาน <span id="modalShiftLabel"
                                    class="shift-badge">กะ B</span></div>
                        </div>
                    </div>
                    <button class="modal-close-btn" data-bs-dismiss="modal">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>

                <!-- Shift toggle inside modal -->
                <div style="padding: 16px 18px 0;">
                    <div class="modal-shift-toggle">
                        <button class="modal-shift-btn" data-shift="A" onclick="setModalShift('A')">
                            <i class="fas fa-sun me-1"></i> กะ A
                        </button>
                        <button class="modal-shift-btn active" data-shift="B" onclick="setModalShift('B')">
                            <i class="fas fa-moon me-1"></i> กะ B
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="modal-tab-bar">
                    <button class="modal-tab-btn active" onclick="switchModalTab('prod', this)">
                        <i class="fas fa-industry"></i> พนักงานผลิต
                        <span class="modal-tab-count" id="cnt-prod">0</span>
                    </button>
                    <button class="modal-tab-btn" onclick="switchModalTab('tech', this)">
                        <i class="fas fa-screwdriver-wrench"></i> ช่างผลิต
                        <span class="modal-tab-count" id="cnt-tech">0</span>
                    </button>
                    <button class="modal-tab-btn" onclick="switchModalTab('qc', this)">
                        <i class="fas fa-magnifying-glass-chart"></i> QC
                        <span class="modal-tab-count" id="cnt-qc">0</span>
                    </button>
                </div>

                <!-- Body -->
                <div class="modal-body-custom">

                    <!-- พนักงานผลิต -->
                    <div class="modal-tab-panel active" id="modal-panel-prod">
                        <div class="staff-modern-list" id="modal-list-prod"></div>
                        <div class="add-staff-row">
                            <i class="fas fa-user-plus add-staff-icon"></i>
                            <input class="add-staff-input" id="newProdName" placeholder="ชื่อพนักงานผลิต..."
                                onkeydown="if(event.key==='Enter') addProdModal()">
                            <button class="add-staff-btn" id="addProdBtn">
                                <i class="fas fa-plus"></i> เพิ่ม
                            </button>
                        </div>
                    </div>

                    <!-- ช่างผลิต -->
                    <div class="modal-tab-panel" id="modal-panel-tech">
                        <div class="staff-modern-list" id="modal-list-tech"></div>
                        <div class="add-staff-row">
                            <i class="fas fa-user-plus add-staff-icon"></i>
                            <input class="add-staff-input" id="newTechName" placeholder="ชื่อช่างผลิต..."
                                onkeydown="if(event.key==='Enter') addTechModal()">
                            <button class="add-staff-btn" id="addTechBtn">
                                <i class="fas fa-plus"></i> เพิ่ม
                            </button>
                        </div>
                    </div>

                    <!-- QC -->
                    <div class="modal-tab-panel" id="modal-panel-qc">
                        <div class="staff-modern-list" id="modal-list-qc"></div>
                        <div class="add-staff-row">
                            <i class="fas fa-user-plus add-staff-icon"></i>
                            <input class="add-staff-input" id="newQcName" placeholder="ชื่อ QC..."
                                onkeydown="if(event.key==='Enter') addQcModal()">
                            <button class="add-staff-btn" id="addQcBtn">
                                <i class="fas fa-plus"></i> เพิ่ม
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="modal-footer-custom">
                    <div class="total-info">
                        <i class="fas fa-users" style="color:var(--accent-2); font-size:14px;"></i>
                        รวมทั้งหมด <span class="num" id="total-all">0</span> คน
                    </div>
                    <button class="done-modal-btn" data-bs-dismiss="modal">
                        <i class="fas fa-check"></i> เสร็จสิ้น
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(e => console.log(e)));
        }

        // ============================================================
        //  DATA MODEL : รองรับ 2 กะ (A และ B)
        // ============================================================
        let staffData = {
            A: { prod: [], tech: [], qc: [] },
            B: { prod: [], tech: [], qc: [] }
        };

        let selections = {
            A: {
                otOut: new Set(), otWork: new Set(), sundayStaff: new Set(), techSunday: new Set(), sick: new Set(),
                personalLeave: new Set(), otNew: new Set()
            },
            B: {
                otOut: new Set(), otWork: new Set(), sundayStaff: new Set(), techSunday: new Set(), sick: new Set(),
                personalLeave: new Set(), otNew: new Set()
            }
        };

        // modal กำลังจัดการกะไหน
        let modalShift = 'B';

        // inline edit/delete state ต่อ type: { type: index } หรือ null
        let editingState = { prod: null, tech: null, qc: null };
        let deletingState = { prod: null, tech: null, qc: null };

        // ============================================================
        //  โหลด / บันทึก
        // ============================================================
        function loadStaffData() {
            const stored = localStorage.getItem("teamplus_full_data_v4");
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (data.A && data.B && data.A.prod && data.B.prod) {
                        staffData = data;
                        const selStored = localStorage.getItem("teamplus_selections_v4");
                        if (selStored) {
                            const sel = JSON.parse(selStored);
                            for (let s of ['A', 'B']) {
                                for (let key of ['otOut', 'otWork', 'sundayStaff', 'techSunday', 'sick', 'personalLeave', 'otNew']) {
                                    if (sel[s] && sel[s][key]) {
                                        selections[s][key] = new Set(sel[s][key]);
                                    }
                                }
                            }
                        }
                        return;
                    }
                } catch (e) { /* fallback */ }
            }

            const old = localStorage.getItem("teamplus_full_data");
            if (old) {
                try {
                    const oldData = JSON.parse(old);
                    if (oldData.prod && oldData.tech && oldData.qc) {
                        staffData.B.prod = oldData.prod || [];
                        staffData.B.tech = oldData.tech || [];
                        staffData.B.qc = oldData.qc || [];
                        staffData.A.prod = ["ปิญาพร", "น้ำฝน", "มุทิตา", "พัชรพร", "จันทร์ใส", "อุราพร", "วรัณญา", "สุณิสา", "วรภร", "ฉันทนา", "นฤมล"];
                        staffData.A.tech = ["เทวราช", "อิสระ"];
                        staffData.A.qc = ["ปาริฉัตร", "กมลพร"];
                        saveStaffData();
                        return;
                    }
                } catch (e) { /* ignore */ }
            }

            staffData.B.prod = ["ปิยนุช", "ศศิวิมล", "จงรัก", "ภาวิตา", "ณัฐธิดา", "สุพิชญา", "สิทธิศักดิ์", "นุชนารถ", "กรรณิกา"];
            staffData.B.tech = ["เสกสรร", "สุรศักดิ์"];
            staffData.B.qc = ["ปราชญาทิพย์", "ปาริฉัตร"];

            staffData.A.prod = ["ปิยนุช", "น้ำฝน", "มุทิตา", "พัชรพร", "จันทร์ใส", "อุราพร", "วรัณญา", "สุณิสา", "วรภร", "ฉันทนา", "นฤมล"];
            staffData.A.tech = ["เทวราช", "อิสระ"];
            staffData.A.qc = ["อารียา", "กมลพร"];

            saveStaffData();
        }

        function saveStaffData() {
            localStorage.setItem("teamplus_full_data_v4", JSON.stringify(staffData));
            const selSave = {};
            for (let s of ['A', 'B']) {
                selSave[s] = {};
                for (let key of ['otOut', 'otWork', 'sundayStaff', 'techSunday', 'sick', 'personalLeave', 'otNew']) {
                    selSave[s][key] = Array.from(selections[s][key]);
                }
            }
            localStorage.setItem("teamplus_selections_v4", JSON.stringify(selSave));
        }

        // ============================================================
        //  Helpers
        // ============================================================
        function getCurrentShift() {
            return document.getElementById('shift').value;
        }

        function getStaff(shift, type) {
            return staffData[shift] ? staffData[shift][type] || [] : [];
        }

        function getAllPersonnel(shift) {
            const s = staffData[shift] || { prod: [], tech: [], qc: [] };
            let all = [];
            s.prod.forEach(name => all.push({ name, type: "ผลิต" }));
            s.tech.forEach(name => all.push({ name, type: "ช่าง" }));
            s.qc.forEach(name => all.push({ name, type: "QC" }));
            return all;
        }

        function getCountByTypeFromSet(shift, personSet, type) {
            const s = staffData[shift] || { prod: [], tech: [], qc: [] };
            const list = type === 'ผลิต' ? s.prod : type === 'ช่าง' ? s.tech : s.qc;
            return list.filter(name => personSet.has(name)).length;
        }

        function removeNameFromAllSets(shift, name) {
            const sel = selections[shift] || {};
            for (let key of ['otOut', 'otWork', 'sundayStaff', 'techSunday', 'sick', 'personalLeave', 'otNew']) {
                if (sel[key]) sel[key].delete(name);
            }
        }

        function updateNameInAllSets(shift, oldName, newName) {
            const sel = selections[shift] || {};
            for (let key of ['otOut', 'otWork', 'sundayStaff', 'techSunday', 'sick', 'personalLeave', 'otNew']) {
                if (sel[key] && sel[key].has(oldName)) {
                    sel[key].delete(oldName);
                    sel[key].add(newName);
                }
            }
        }

        function showToast(msg, icon) {
            Swal.fire({ icon: icon || 'success', title: msg, timer: 1300, showConfirmButton: false });
        }

        // ============================================================
        //  MODAL: render lists (ตาม modalShift) — inline edit/delete, ไม่มี modal ซ้อน modal
        // ============================================================
        const avClass = { prod: 'av-prod', tech: 'av-tech', qc: 'av-qc' };
        const avIcon = { prod: 'fa-person', tech: 'fa-wrench', qc: 'fa-eye' };

        function renderModalList(type) {
            const shift = modalShift;
            const arr = getStaff(shift, type);
            const list = document.getElementById('modal-list-' + type);
            if (!list) return;
            list.innerHTML = '';

            if (!arr.length) {
                list.innerHTML = `<div class="empty-state-modal"><i class="fas fa-inbox"></i>ยังไม่มีรายชื่อ</div>`;
            } else {
                arr.forEach((name, i) => {
                    const row = document.createElement('div');
                    row.className = 'staff-modern-row';

                    if (editingState[type] === i) {
                        // ----- inline edit mode -----
                        row.classList.add('editing');
                        const avatar = document.createElement('div');
                        avatar.className = `staff-avatar-box ${avClass[type]}`;
                        avatar.innerHTML = `<i class="fas ${avIcon[type]}"></i>`;

                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'edit-name-input';
                        input.value = name;

                        const btnGroup = document.createElement('div');
                        btnGroup.className = 'action-btn-group';

                        const saveBtn = document.createElement('button');
                        saveBtn.className = 'action-icon-btn confirm-ok';
                        saveBtn.title = 'บันทึก';
                        saveBtn.innerHTML = '<i class="fas fa-check"></i>';
                        saveBtn.type = 'button';

                        const cancelBtn = document.createElement('button');
                        cancelBtn.className = 'action-icon-btn confirm-cancel';
                        cancelBtn.title = 'ยกเลิก';
                        cancelBtn.innerHTML = '<i class="fas fa-xmark"></i>';
                        cancelBtn.type = 'button';

                        const commitEdit = () => {
                            const newName = input.value.trim();
                            if (!newName) {
                                input.style.borderColor = 'var(--danger)';
                                return;
                            }
                            if (newName !== name && arr.includes(newName)) {
                                input.style.borderColor = 'var(--danger)';
                                return;
                            }
                            arr[i] = newName;
                            updateNameInAllSets(shift, name, newName);
                            saveStaffData();
                            editingState[type] = null;
                            renderModalList(type);
                            refreshAllUI();
                            showToast('บันทึกแล้ว');
                        };

                        saveBtn.addEventListener('click', commitEdit);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') commitEdit();
                            if (e.key === 'Escape') { editingState[type] = null; renderModalList(type); }
                        });
                        cancelBtn.addEventListener('click', () => {
                            editingState[type] = null;
                            renderModalList(type);
                        });

                        btnGroup.appendChild(saveBtn);
                        btnGroup.appendChild(cancelBtn);
                        row.appendChild(avatar);
                        row.appendChild(input);
                        row.appendChild(btnGroup);
                        list.appendChild(row);
                        // focus after insert
                        setTimeout(() => { input.focus(); input.select(); }, 0);
                        return;
                    }

                    if (deletingState[type] === i) {
                        // ----- inline delete confirm mode -----
                        row.classList.add('editing');
                        const text = document.createElement('div');
                        text.className = 'delete-confirm-text';
                        text.innerHTML = `ลบ <b>${escapeHtml(name)}</b> ใช่ไหม?`;

                        const btnGroup = document.createElement('div');
                        btnGroup.className = 'action-btn-group';

                        const okBtn = document.createElement('button');
                        okBtn.className = 'action-icon-btn confirm-ok';
                        okBtn.title = 'ยืนยันลบ';
                        okBtn.innerHTML = '<i class="fas fa-check"></i>';
                        okBtn.type = 'button';
                        okBtn.addEventListener('click', () => {
                            arr.splice(i, 1);
                            removeNameFromAllSets(shift, name);
                            saveStaffData();
                            deletingState[type] = null;
                            renderModalList(type);
                            refreshAllUI();
                            showToast('ลบสำเร็จ');
                        });

                        const cancelBtn = document.createElement('button');
                        cancelBtn.className = 'action-icon-btn confirm-cancel';
                        cancelBtn.title = 'ยกเลิก';
                        cancelBtn.innerHTML = '<i class="fas fa-xmark"></i>';
                        cancelBtn.type = 'button';
                        cancelBtn.addEventListener('click', () => {
                            deletingState[type] = null;
                            renderModalList(type);
                        });

                        btnGroup.appendChild(okBtn);
                        btnGroup.appendChild(cancelBtn);
                        row.appendChild(text);
                        row.appendChild(btnGroup);
                        list.appendChild(row);
                        return;
                    }

                    // ----- normal display row -----
                    const avatar = document.createElement('div');
                    avatar.className = `staff-avatar-box ${avClass[type]}`;
                    avatar.innerHTML = `<i class="fas ${avIcon[type]}"></i>`;

                    const nameEl = document.createElement('div');
                    nameEl.className = 'staff-modern-name';
                    nameEl.textContent = name;

                    const btnGroup = document.createElement('div');
                    btnGroup.className = 'action-btn-group';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'action-icon-btn edit';
                    editBtn.title = 'แก้ไข';
                    editBtn.innerHTML = '<i class="fas fa-pen"></i>';
                    editBtn.type = 'button';
                    editBtn.addEventListener('click', () => {
                        deletingState[type] = null;
                        editingState[type] = i;
                        renderModalList(type);
                    });

                    const delBtn = document.createElement('button');
                    delBtn.className = 'action-icon-btn del';
                    delBtn.title = 'ลบ';
                    delBtn.innerHTML = '<i class="fas fa-trash-can"></i>';
                    delBtn.type = 'button';
                    delBtn.addEventListener('click', () => {
                        editingState[type] = null;
                        deletingState[type] = i;
                        renderModalList(type);
                    });

                    btnGroup.appendChild(editBtn);
                    btnGroup.appendChild(delBtn);
                    row.appendChild(avatar);
                    row.appendChild(nameEl);
                    row.appendChild(btnGroup);
                    list.appendChild(row);
                });
            }

            const cnt = document.getElementById('cnt-' + type);
            if (cnt) cnt.textContent = arr.length;
            updateModalTotal();
        }

        function updateModalTotal() {
            const shift = modalShift;
            const s = staffData[shift] || { prod: [], tech: [], qc: [] };
            const total = s.prod.length + s.tech.length + s.qc.length;
            const el = document.getElementById('total-all');
            if (el) el.textContent = total;
            const label = document.getElementById('modalShiftLabel');
            if (label) label.textContent = 'กะ ' + shift;
        }

        function renderAllModalLists() {
            renderModalList('prod');
            renderModalList('tech');
            renderModalList('qc');
        }

        function setModalShift(shift) {
            modalShift = shift;
            editingState = { prod: null, tech: null, qc: null };
            deletingState = { prod: null, tech: null, qc: null };
            document.querySelectorAll('.modal-shift-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.shift === shift);
            });
            renderAllModalLists();
        }

        function switchModalTab(type, btn) {
            document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.modal-tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('modal-panel-' + type).classList.add('active');
        }

        // ============================================================
        //  MODAL: add
        // ============================================================
        function addModalStaff(type, inputId) {
            const shift = modalShift;
            const inp = document.getElementById(inputId);
            const val = inp.value.trim();
            const arr = getStaff(shift, type);
            if (!val || arr.includes(val)) {
                inp.style.outline = '2px solid var(--danger)';
                setTimeout(() => inp.style.outline = '', 600);
                return;
            }
            arr.push(val);
            inp.value = '';
            saveStaffData();
            renderModalList(type);
            refreshAllUI();
            showToast('เพิ่มแล้ว');
        }

        function addProdModal() { addModalStaff('prod', 'newProdName'); }

        function addTechModal() { addModalStaff('tech', 'newTechName'); }

        function addQcModal() { addModalStaff('qc', 'newQcName'); }

        // ============================================================
        //  MAIN UI : render ตาม current shift
        // ============================================================
        function renderStaffGridSimple(containerId, items, selectedSet) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            items.forEach(name => {
                const chip = document.createElement('div');
                chip.className = `staff-chip ${selectedSet.has(name) ? 'active' : ''}`;
                chip.innerHTML =
                    `<span>${escapeHtml(name)}</span><i class="fas ${selectedSet.has(name) ? 'fa-circle-check' : 'fa-circle-plus'}"></i>`;
                chip.addEventListener('click', () => {
                    if (selectedSet.has(name)) selectedSet.delete(name);
                    else selectedSet.add(name);
                    refreshAllUI();
                });
                container.appendChild(chip);
            });
        }

        function renderDynamicGrid(containerId, personList, selectedSet) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            personList.forEach(p => {
                const chip = document.createElement('div');
                chip.className = `staff-chip ${selectedSet.has(p.name) ? 'active' : ''}`;
                chip.innerHTML =
                    `<span>${escapeHtml(p.name)}</span><span class="badge-type">${p.type}</span><i class="fas ${selectedSet.has(p.name) ? 'fa-circle-check' : 'fa-circle-plus'}"></i>`;
                chip.addEventListener('click', () => {
                    if (selectedSet.has(p.name)) selectedSet.delete(p.name);
                    else selectedSet.add(p.name);
                    renderDynamicGrid(containerId, personList, selectedSet);
                });
                container.appendChild(chip);
            });
        }

        function renderOtNewSections(shift) {
            const s = staffData[shift] || { prod: [], tech: [], qc: [] };
            const sel = selections[shift] || { otNew: new Set() };
            renderStaffGridSimple("otNewProdList", s.prod, sel.otNew);
            renderStaffGridSimple("otNewTechList", s.tech, sel.otNew);
            renderStaffGridSimple("otNewQcList", s.qc, sel.otNew);
        }

        function refreshAllUI() {
            const shift = getCurrentShift();
            const reportType = document.getElementById("reportTypeSelect").value;
            document.getElementById("otNormalSection").style.display = (reportType === "ot_normal" || reportType ===
                "ot_sunday") ? "block" : "none";
            document.getElementById("reportAttendanceSection").style.display = (reportType === "report_attendance") ?
                "block" : "none";
            document.getElementById("reportOtNewSection").style.display = (reportType === "report_ot_new") ? "block" :
                "none";

            const s = staffData[shift] || { prod: [], tech: [], qc: [] };
            const sel = selections[shift] || {
                otOut: new Set(), otWork: new Set(), sundayStaff: new Set(),
                techSunday: new Set(), sick: new Set(), personalLeave: new Set(), otNew: new Set()
            };

            if (reportType === "ot_normal") {
                document.getElementById("normalSection").style.display = "block";
                document.getElementById("sundaySection").style.display = "none";
                renderStaffGridSimple("otOutList", s.prod, sel.otOut);
                renderStaffGridSimple("otWorkList", s.prod, sel.otWork);
            } else if (reportType === "ot_sunday") {
                document.getElementById("normalSection").style.display = "none";
                document.getElementById("sundaySection").style.display = "block";
                renderStaffGridSimple("sundayStaffList", s.prod, sel.sundayStaff);
                renderStaffGridSimple("technicianList", s.tech, sel.techSunday);
            } else if (reportType === "report_attendance") {
                renderDynamicGrid("sickStaffList", getAllPersonnel(shift), sel.sick);
                renderDynamicGrid("personalLeaveStaffList", getAllPersonnel(shift), sel.personalLeave);
            } else if (reportType === "report_ot_new") {
                renderOtNewSections(shift);
            }
        }

        // ============================================================
        //  REPORT GENERATION
        // ============================================================
        function formatDateThai(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d)) return "";
            return `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear() + 543}`;
        }

        function generateReport() {
            const type = document.getElementById("reportTypeSelect").value;
            const shift = getCurrentShift();
            const dateText = formatDateThai(document.getElementById("date").value);
            const s = staffData[shift] || { prod: [], tech: [], qc: [] };
            const sel = selections[shift] || {
                otOut: new Set(), otWork: new Set(), sundayStaff: new Set(),
                techSunday: new Set(), sick: new Set(), personalLeave: new Set(), otNew: new Set()
            };

            const totalTech = s.tech.length;
            const totalProd = s.prod.length;
            const totalQc = s.qc.length;
            const totalAll = totalTech + totalProd + totalQc;

            if (type === "ot_normal") {
                let out = `${dateText} ${shift === 'A' ? 'กะ A' : 'กะ B'}\n`;
                if (!sel.otOut.size) out += `ไม่มีพนักงานออก OT ค่ะ\n`;
                else {
                    out += `พนักงานออก OT ${sel.otOut.size} คน ค่ะ\n`; let i = 1; for (let n of sel.otOut) out +=
                        `${i++}.${n}\n`;
                }
                if (sel.otWork.size) { out += "OT พับถุง\n"; let i = 1; for (let n of sel.otWork) out += `${i++}.${n}\n`; }
                return out.trim();
            } else if (type === "ot_sunday") {
                let out = `OT วันอาทิตย์ ${shift === 'A' ? 'กะ A' : 'กะ B'}\n`;
                let idx = 1;
                if (sel.sundayStaff.size) { out += "พนักงาน\n"; for (let n of sel.sundayStaff) out += `${idx++}.${n}\n`; }
                if (sel.techSunday.size) { out += "ช่างผลิต\n"; for (let n of sel.techSunday) out += `${idx++}.${n}\n`; }
                if (!sel.sundayStaff.size && !sel.techSunday.size) out += "ไม่มีรายชื่อพนักงานค่ะ";
                return out;
            } else if (type === "report_attendance") {
                const combinedAbsent = new Set([...sel.sick, ...sel.personalLeave]);
                const absentTech = getCountByTypeFromSet(shift, combinedAbsent, "ช่าง");
                const absentProd = getCountByTypeFromSet(shift, combinedAbsent, "ผลิต");
                const absentQc = getCountByTypeFromSet(shift, combinedAbsent, "QC");
                const presentTech = totalTech - absentTech;
                const presentProd = totalProd - absentProd;
                const presentQc = totalQc - absentQc;
                const totalPresent = presentTech + presentProd + presentQc;
                let output = `รายงานการมาปฎิบัติงาน \nวันที่  ${dateText}\nพนักงาน${shift === 'A' ? 'กะ A' : 'กะ B'}\n\n`;
                output += `ช่าง   ${presentTech} คน\nผลิต ${presentProd} คน\nQC    ${presentQc} คน\nรวม ${totalPresent}/${totalAll} คน\n\n`;
                if (sel.sick.size) { for (let name of sel.sick) output += `${name} ลาป่วย\n`; }
                if (sel.personalLeave.size) { for (let name of sel.personalLeave) output += `${name} ลากิจ\n`; }
                return output;
            } else {
                const otOutTech = getCountByTypeFromSet(shift, sel.otNew, "ช่าง");
                const otOutProd = getCountByTypeFromSet(shift, sel.otNew, "ผลิต");
                const otOutQc = getCountByTypeFromSet(shift, sel.otNew, "QC");
                const presentTech = totalTech - otOutTech;
                const presentProd = totalProd - otOutProd;
                const presentQc = totalQc - otOutQc;
                const totalPresent = presentTech + presentProd + presentQc;
                let output = `รายงานการทำ OT\nวันที่  ${dateText}\nพนักงาน${shift === 'A' ? 'กะ A' : 'กะ B'}\n\n`;
                output += `ช่าง   ${presentTech} คน\nผลิต ${presentProd} คน\nQC    ${presentQc} คน\nรวม ${totalPresent}/${totalAll} คน\n\n`;
                if (sel.otNew.size === 0) output += `ไม่มีรายชื่อออก OT`;
                else { for (let name of sel.otNew) output += `${name} ออก OT\n`; }
                return output;
            }
        }

        async function generateAndCopy() {
            const text = generateReport();
            document.getElementById('result').value = text;
            try {
                await navigator.clipboard.writeText(text);
                const badge = document.getElementById('copyBadge');
                badge.classList.remove('d-none');
                setTimeout(() => badge.classList.add('d-none'), 1800);
                showToast('คัดลอกสำเร็จ!');
            } catch {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถคัดลอกได้ ลองคัดลอกข้อความด้วยตัวเองค่ะ', 'error');
            }
        }

        // ============================================================
        //  UTILITY
        // ============================================================
        function setDefaultDate() { document.getElementById('date').value = new Date().toISOString().slice(0, 10); }

        function setCurrentYear() { document.getElementById('currentYear').innerText = new Date().getFullYear(); }

        function hideSplash() {
            const s = document.getElementById('splashScreen');
            if (s) {
                s.classList.add('hide');
                setTimeout(() => s.style.display = 'none', 500);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
        }

        // ============================================================
        //  INIT
        // ============================================================
        window.addEventListener('load', () => {
            loadStaffData();
            setDefaultDate();
            setCurrentYear();
            modalShift = getCurrentShift();
            document.querySelectorAll('.modal-shift-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.shift === modalShift);
            });
            renderAllModalLists();
            refreshAllUI();

            document.getElementById('generateBtn').addEventListener('click', generateAndCopy);
            document.getElementById('reportTypeSelect').addEventListener('change', () => refreshAllUI());
            document.getElementById('shift').addEventListener('change', () => {
                modalShift = getCurrentShift();
                document.querySelectorAll('.modal-shift-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.shift === modalShift);
                });
                refreshAllUI();
            });

            document.getElementById('addProdBtn')?.addEventListener('click', addProdModal);
            document.getElementById('addTechBtn')?.addEventListener('click', addTechModal);
            document.getElementById('addQcBtn')?.addEventListener('click', addQcModal);

            document.querySelectorAll('.toggle-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.getAttribute('data-value');
                    document.getElementById("normalSection").style.display = type === 'normal' ? 'block' : 'none';
                    document.getElementById("sundaySection").style.display = type === 'sunday' ? 'block' : 'none';
                    document.querySelectorAll('.toggle-option').forEach(o => o.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            document.getElementById('staffManagementModal').addEventListener('show.bs.modal', function () {
                modalShift = getCurrentShift();
                editingState = { prod: null, tech: null, qc: null };
                deletingState = { prod: null, tech: null, qc: null };
                document.querySelectorAll('.modal-shift-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.shift === modalShift);
                });
                renderAllModalLists();
            });

            hideSplash();
        });

        setTimeout(() => {
            if (document.getElementById('splashScreen')?.style.display !== 'none') hideSplash();
        }, 2000);
    </script>
</body>
